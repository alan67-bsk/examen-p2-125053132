# Pipeline DataMart: hadoop (procesa) -> db (guarda) -> api (expone)
# Se levanta todo con: docker compose up --build

name: datamart

services:

  
  hadoop:
    build: ./hadoop
    hostname: hadoop
    volumes:
      
      - ./data:/data/input:ro
      
      - ./mapreduce:/app/mapreduce:ro
      
      - resultados:/data/output
      
      - llaves_ssh:/llaves:ro
    networks:
      - red_datamart

 
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - red_datamart

  # API en Flask 
  api:
    build: ./api
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      
      - "${API_PORT:-5001}:5000"
    volumes:
      - ./scripts:/app/scripts:ro
      - resultados:/data/output:ro
      - llaves_ssh:/llaves
    networks:
      - red_datamart


networks:
  red_datamart:
    driver: bridge

volumes:
  pgdata:       # datos de PostgreSQL
  resultados:   # salida del job de Hadoop
  llaves_ssh:   # llave publica de la api
